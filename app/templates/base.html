<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Returns Manager{% endblock %}</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem;
         background: #fafafa; color: #1a1a1a; }
  @media (prefers-color-scheme: dark) { body { background: #16181c; color: #e6e6e6; } }
  h1 { font-size: 1.4rem; }
  label { display: block; margin-top: 0.9rem; font-weight: 600; font-size: 0.9rem; }
  input, select { width: 100%; padding: 0.5rem; margin-top: 0.25rem; box-sizing: border-box;
                  border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; background: inherit; color: inherit; }
  button { margin-top: 1.3rem; padding: 0.6rem 1.2rem; border: none; border-radius: 6px;
           background: #2563eb; color: white; font-size: 1rem; cursor: pointer; }
  button.secondary { background: #6b7280; }
  .card { background: rgba(127,127,127,0.08); border-radius: 10px; padding: 1rem 1.2rem; margin-top: 1rem; }
  .verdict { display: inline-block; padding: 0.15rem 0.6rem; border-radius: 999px; font-size: 0.8rem;
             font-weight: 700; }
  .PASS { background: #16a34a33; color: #16a34a; }
  .FAIL { background: #dc262633; color: #dc2626; }
  .UNCERTAIN { background: #d9770633; color: #d97706; }
  .thumb { width: 96px; height: 96px; object-fit: cover; border-radius: 6px; margin: 0.3rem 0.3rem 0 0; }
  small.hint { color: #888; display: block; margin-top: 0.2rem; }
  code { background: rgba(127,127,127,0.15); padding: 0.1rem 0.3rem; border-radius: 4px; }
</style>
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>
